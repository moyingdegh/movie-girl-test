<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>20题测出你的青春电影女主人设</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow-x: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: linear-gradient(
          145deg,
          #fce8ec 0%,
          #f5e6ff 50%,
          #fff5f0 100%
        );
        color: #2d1b36;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        display: none;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        padding: 20px;
        overflow-y: auto;
      }
      .page.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      /* ── Cover ── */
      .cover-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 32px;
        padding: 36px 28px;
        max-width: 380px;
        width: 100%;
        aspect-ratio: 3/4;
        text-align: center;
        box-shadow:
          0 8px 40px rgba(192, 132, 252, 0.15),
          0 2px 8px rgba(255, 107, 157, 0.08);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .cover-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #ff6b9d, #c084fc, #ff6b9d);
      }
      .cover-badge {
        display: inline-block;
        background: linear-gradient(135deg, #ff6b9d, #c084fc);
        color: #fff;
        font-size: 12px;
        padding: 6px 16px;
        border-radius: 20px;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }
      .cover-title {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.35;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #2d1b36, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .cover-sub {
        font-size: 15px;
        color: #7c6b8a;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .cover-desc {
        font-size: 14px;
        color: #a895b3;
        line-height: 1.5;
        margin-bottom: 28px;
      }
      /* ── Cover character images ── */
      .cover-chars {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .cover-chars img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 2px 8px rgba(192, 132, 252, 0.18);
        transition: transform 0.2s;
      }
      .cover-types {
        font-size: 13px;
        color: #8f7a9e;
        line-height: 1.7;
        margin-bottom: 22px;
        text-align: center;
        letter-spacing: 0.3px;
      }
      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
        min-height: 52px;
        padding: 0 32px;
        width: 100%;
        max-width: 280px;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: linear-gradient(135deg, #ff6b9d, #c084fc);
        color: #fff;
        box-shadow: 0 4px 20px rgba(255, 107, 157, 0.35);
      }
      .btn-primary:hover {
        box-shadow: 0 6px 28px rgba(255, 107, 157, 0.45);
      }
      .btn-outline {
        background: transparent;
        border: 2px solid #e8dff0;
        color: #6b5b7b;
        font-size: 15px;
        min-height: 46px;
      }
      .btn-outline:hover {
        background: #f8f4ff;
      }
      /* ── Decorative stars ── */
      .deco {
        position: absolute;
        pointer-events: none;
        opacity: 0.3;
        font-size: 20px;
        color: #c084fc;
      }
      .deco-1 {
        top: 12%;
        left: 8%;
      }
      .deco-2 {
        top: 18%;
        right: 10%;
      }
      .deco-3 {
        bottom: 15%;
        right: 12%;
      }
      .deco-4 {
        bottom: 20%;
        left: 6%;
      }
      /* ── Quiz ── */
      .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 380px;
        margin-bottom: 24px;
        position: relative;
      }
      .btn-back {
        background: none;
        border: none;
        color: #6b5b7b;
        font-size: 15px;
        cursor: pointer;
        padding: 8px 4px;
        min-width: 60px;
        text-align: left;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-back.hidden {
        visibility: hidden;
      }
      .btn-back .arrow {
        display: inline-block;
        margin-right: 4px;
      }
      .question-number {
        font-size: 14px;
        font-weight: 600;
        color: #c084fc;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .question-number span {
        color: #d4c4e0;
        font-weight: 400;
      }
      .quiz-card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 28px;
        padding: 32px 24px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 4px 24px rgba(192, 132, 252, 0.1);
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .question-text {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.55;
        margin-bottom: 28px;
        text-align: center;
        min-height: 3.1em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .option {
        display: block;
        width: 100%;
        padding: 16px 20px;
        border: 2px solid #f0e8f5;
        border-radius: 16px;
        background: #fff;
        font-size: 16px;
        color: #2d1b36;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
        line-height: 1.4;
        -webkit-tap-highlight-color: transparent;
        min-height: 52px;
      }
      .option:active {
        transform: scale(0.98);
      }
      .option:hover {
        border-color: #e0d0ec;
        background: #faf8ff;
      }
      .option.selected {
        border-color: #c084fc;
        background: #f8f0ff;
        box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
      }
      .option .option-letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #f5f0fa;
        color: #7c6b8a;
        font-size: 13px;
        font-weight: 600;
        margin-right: 12px;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .option.selected .option-letter {
        background: #c084fc;
        color: #fff;
      }
      /* ── Progress ── */
      .progress-wrap {
        width: 100%;
        max-width: 380px;
        margin-top: 16px;
      }
      .progress-bar {
        height: 4px;
        background: #ece4f0;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff6b9d, #c084fc);
        border-radius: 4px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .progress-label {
        font-size: 12px;
        color: #a895b3;
        text-align: center;
        margin-top: 6px;
      }
      /* ── Result ── */
      .result-scroll {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .result-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 28px;
        padding: 36px 28px 32px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 40px rgba(192, 132, 252, 0.15);
        position: relative;
        overflow: hidden;
      }
      .result-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #ff6b9d, #c084fc, #ff6b9d);
      }
      .result-image {
        width: 160px;
        height: 160px;
        border-radius: 16px;
        object-fit: cover;
        margin: 0 auto 14px;
        display: block;
        box-shadow: 0 4px 20px rgba(192, 132, 252, 0.18);
      }
      .result-deco {
        font-size: 14px;
        color: #d4c4e0;
        letter-spacing: 6px;
        margin-bottom: 12px;
      }
      .result-label {
        font-size: 15px;
        color: #7c6b8a;
        margin-bottom: 10px;
      }
      .result-name {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 16px;
        background: linear-gradient(135deg, #2d1b36, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .result-tags {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .tag {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 50px;
        background: linear-gradient(135deg, #fce4ec, #f3e8ff);
        color: #6b5b7b;
        font-size: 13px;
        font-weight: 500;
      }
      .result-desc {
        font-size: 15px;
        line-height: 1.8;
        color: #4a3f5c;
        text-align: left;
        padding: 0 4px;
      }
      .result-analysis-card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        padding: 24px 24px 22px;
        max-width: 380px;
        width: 100%;
        margin-top: 14px;
        box-shadow: 0 4px 20px rgba(192, 132, 252, 0.08);
      }
      .analysis-deco {
        font-size: 12px;
        color: #d4c4e0;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 10px;
      }
      .analysis-heading {
        font-size: 14px;
        font-weight: 600;
        color: #c084fc;
        text-align: center;
        margin-bottom: 14px;
        letter-spacing: 2px;
      }
      .analysis-paragraph {
        font-size: 15px;
        line-height: 1.8;
        color: #4a3f5c;
        text-align: left;
        margin-bottom: 12px;
      }
      .analysis-paragraph:last-child {
        margin-bottom: 0;
      }
      .result-quote {
        font-size: 18px;
        line-height: 1.6;
        color: #c084fc;
        font-style: italic;
        padding: 16px 0;
        border-top: 1px solid #f0e8f5;
        border-bottom: 1px solid #f0e8f5;
        margin-bottom: 4px;
      }
      .result-quote::before {
        content: "\201C";
        font-size: 32px;
        color: #ff6b9d;
        display: block;
        margin-bottom: -4px;
      }
      .result-footer {
        margin-top: 16px;
        text-align: center;
        width: 100%;
      }
      .screenshot-tip {
        font-size: 13px;
        color: #a895b3;
        margin-bottom: 6px;
        line-height: 1.5;
      }
      .follow-tip {
        font-size: 13px;
        color: #7c6b8a;
        margin-bottom: 20px;
        line-height: 1.5;
      }
.result-footer .btn {
        margin-top: 4px;
      }
      /* ── Responsive ── */
      @media (max-width: 400px) {
        .page {
          padding: 16px;
        }
        .cover-card {
          padding: 28px 20px;
          border-radius: 24px;
        }
        .cover-title {
          font-size: 24px;
        }
        .quiz-card {
          padding: 24px 18px;
          border-radius: 24px;
        }
        .question-text {
          font-size: 17px;
          min-height: 2.8em;
        }
        .option {
          padding: 14px 16px;
          font-size: 15px;
          min-height: 48px;
        }
        .result-card {
          padding: 28px 20px 24px;
          border-radius: 24px;
        }
        .result-name {
          font-size: 24px;
        }
        .result-image {
          width: 130px;
          height: 130px;
        }
        .result-analysis-card {
          padding: 20px 18px 18px;
          border-radius: 18px;
        }
        .analysis-heading {
          font-size: 13px;
        }
        .analysis-paragraph {
          font-size: 14px;
        }
      }
      @media (min-height: 800px) {
        .quiz-card {
          justify-content: center;
        }
        .question-text {
          margin-bottom: 32px;
        }
      }
      /* ── Ensure scrolling on result page if needed ── */
      #page-result.active {
        justify-content: flex-start;
        padding-top: 24px;
        padding-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <!-- ═══ COVER PAGE ═══ -->
    <div id="page-cover" class="page active">
      <div class="cover-card">
        <span class="deco deco-1">✦</span>
        <span class="deco deco-2">✧</span>
        <span class="deco deco-3">✦</span>
        <span class="deco deco-4">✧</span>
        <div class="cover-badge">🎬 青春电影人设测试</div>
        <h1 class="cover-title">8 种青春女主人设<br />测测哪一种最像你？</h1>
        <div class="cover-chars">
          <img src="images/moonlight.png" alt="风里白月光女主" />
          <img src="images/sweet.png" alt="蜜桃反差甜妹女主" />
          <img src="images/alpha.png" alt="高能大女主" />
          <img src="images/road.png" alt="出走公路女主" />
        </div>
        <p class="cover-types">
          校园白月光、清冷智性、反差甜妹、高能大女主、<br />雨季文艺、鬼马少女、暖阳邻家……
        </p>
        <button class="btn btn-primary" onclick="startQuiz()">
          进入我的青春电影
        </button>
      </div>
    </div>

    <!-- ═══ QUIZ PAGE ═══ -->
    <div id="page-quiz" class="page">
      <div
        style="
          width: 100%;
          max-width: 380px;
          display: flex;
          flex-direction: column;
          flex: 1;
          justify-content: center;
        "
      >
        <div class="quiz-header">
          <button class="btn-back" id="btn-back" onclick="goPrev()">
            <span class="arrow">&#8592;</span>上一题
          </button>
          <div class="question-number">
            <span id="q-current">01</span> <span>/ 20</span>
          </div>
        </div>

        <div class="quiz-card">
          <div class="question-text" id="question-text"></div>
          <div class="options" id="options-container"></div>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-label" id="progress-label">1 / 20</div>
        </div>
      </div>
    </div>

    <!-- ═══ RESULT PAGE ═══ -->
    <div id="page-result" class="page">
      <div class="result-scroll">
        <div class="result-card" id="result-card">
          <img class="result-image" id="result-image" src="" alt="" />
          <p class="result-label">你的青春电影女主人设是——</p>
          <h2 class="result-name" id="result-name"></h2>
          <div class="result-tags" id="result-tags"></div>
          <div class="result-quote" id="result-quote"></div>
        </div>
        <div class="result-analysis-card">
          <div class="analysis-deco">✦ ✧ ✦</div>
          <p class="analysis-heading">关于你的剧本</p>
          <div id="result-desc"></div>
        </div>
        <div class="result-footer">
          <p class="screenshot-tip">
            这一页很适合截图。<br />把它发给朋友，看看她们是不是也觉得「有点像你」。
          </p>
          <p class="follow-tip">
            想解锁更多测试，欢迎点击 <a href="https://xhslink.com/m/7MpJ9sZ76X7" id="hs-link" target="_blank" rel="noopener" style="color:#c084fc;font-weight:600;text-decoration:none">@奶盖撞星星</a>
          </p>
          <button class="btn btn-primary" onclick="resetQuiz()">
            再拍一遍我的青春电影
          </button>
        </div>
      </div>
    </div>

    <script>
      // ─── Data ───
      const questions = [
        {
          text: "如果你的青春是一部电影，开场镜头最像？",
          options: [
            { text: "阳光照进教室，你坐在窗边低头写字", type: 0 },
            { text: "深夜便利店门口，你一个人戴着耳机走出来", type: 4 },
            { text: "操场边，你和朋友笑到直不起腰", type: 5 },
            { text: "清晨车站，你拖着行李箱准备离开熟悉的城市", type: 7 },
          ],
        },
        {
          text: "你最想拥有哪种青春电影里的名场面？",
          options: [
            { text: "在图书馆和某个人隔着书架对视一秒", type: 1 },
            { text: "穿着卫衣捧着冰淇淋，突然被人夸可爱", type: 2 },
            { text: "放学后和朋友一起骑车穿过树荫", type: 6 },
            { text: "在所有人沉默时，你站起来说出真正想说的话", type: 3 },
          ],
        },
        {
          text: "喜欢一个人时，你更像哪一种状态？",
          options: [
            { text: "不主动打扰，但会默默记住对方喜欢的歌", type: 0 },
            { text: "表面云淡风轻，其实早就把细节分析了几遍", type: 1 },
            { text: "忍不住分享今天的小事，假装只是顺手发给他", type: 2 },
            { text: "想靠近又怕靠太近，最后把话写进备忘录", type: 7 },
          ],
        },
        {
          text: "如果电影里有一场雨，你会出现在哪里？",
          options: [
            { text: "站在空旷天台上，头发被风吹乱也不躲", type: 3 },
            { text: "坐在公交最后一排，看窗外的水痕慢慢流下去", type: 4 },
            { text: "撑着一把颜色很亮的伞，在雨里故意踩水坑", type: 5 },
            { text: "把伞往朋友那边偏一点，自己半边肩膀湿掉", type: 6 },
          ],
        },
        {
          text: "在一群人里，你最容易被什么吸引？",
          options: [
            { text: "说话不多，但眼神很干净的人", type: 0 },
            { text: "看起来很甜，聊天时却说出很清醒的话的人", type: 2 },
            { text: "有明确目标，走路都带风的人", type: 3 },
            { text: "笑起来让人放松，像认识了很久的人", type: 6 },
          ],
        },
        {
          text: "如果给你的青春选一首背景音乐，它会是？",
          options: [
            { text: "一首冷静、低频、适合夜晚独处的歌", type: 1 },
            { text: "一首下雨天听会突然想起很多事的歌", type: 4 },
            { text: "一首前奏一响就想跑起来的快乐歌", type: 5 },
            { text: "一首适合坐在长途车上、看城市慢慢后退的歌", type: 7 },
          ],
        },
        {
          text: "收到一封没有署名的信，你第一反应是？",
          options: [
            { text: "愣一下，安静地把它夹进书里", type: 0 },
            { text: "直接去找线索，想知道是谁写的", type: 3 },
            { text: "一边吐槽一边忍不住笑", type: 5 },
            { text: "读完后很久不说话，像被旧梦击中", type: 7 },
          ],
        },
        {
          text: "朋友临时约你去看午夜场电影，你会？",
          options: [
            { text: "理性评估明天安排再决定", type: 1 },
            { text: "嘴上说太突然了，人已经开始换衣服", type: 2 },
            { text: "被一句「陪我嘛」打动，还是去了", type: 4 },
            { text: "顺路给大家买饮料和小零食", type: 6 },
          ],
        },
        {
          text: "你最喜欢哪一种「被喜欢」的感觉？",
          options: [
            { text: "对方记得你无意间说过的小事", type: 0 },

      const LETTERS = ["A", "B", "C", "D"];

      // ─── State ───
      let currentQuestion = 0;
      let scores = new Array(8).fill(0);
      let answers = new Array(20).fill(-1); // which option index was chosen (-1 = none)

      // ─── Page switching ───
      function showPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      // ─── Cover → Quiz ───
      function startQuiz() {
        showPage("page-quiz");
        currentQuestion = 0;
        renderQuestion();
      }

      // ─── Render question ───
      function renderQuestion() {
        const q = questions[currentQuestion];
        document.getElementById("question-text").textContent = q.text;

        // Question number
        document.getElementById("q-current").textContent = String(
          currentQuestion + 1,
        ).padStart(2, "0");

        // Back button visibility
        document
          .getElementById("btn-back")
          .classList.toggle("hidden", currentQuestion === 0);

        // Options
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        q.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className =
            "option" + (answers[currentQuestion] === idx ? " selected" : "");
          btn.innerHTML =
            '<span class="option-letter">' +
            LETTERS[idx] +
            "</span>" +
            opt.text;
          btn.addEventListener("click", () => selectOption(idx));
          container.appendChild(btn);
        });

        // Progress
        const pct = ((currentQuestion + 1) / questions.length) * 100;
        document.getElementById("progress-fill").style.width = pct + "%";
        document.getElementById("progress-label").textContent =
          currentQuestion + 1 + " / " + questions.length;
      }

      // ─── Select option ───
      function selectOption(optionIndex) {
        const q = questions[currentQuestion];
        const type = q.options[optionIndex].type;

        // Update scores
        if (answers[currentQuestion] !== -1) {
          // Remove previous answer's score
          const prevType = q.options[answers[currentQuestion]].type;
          scores[prevType]--;
        }
        scores[type]++;
        answers[currentQuestion] = optionIndex;

        // Advance
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          showResult();
        }
      }

      // ─── Previous question ───
      function goPrev() {
        if (currentQuestion > 0) {
          currentQuestion--;
          renderQuestion();
        }
      }

      // ─── Calculate & show result ───
      function showResult() {
        // Find each type's last selected question index
        const lastSelected = new Array(8).fill(-1);
        for (let q = 0; q < answers.length; q++) {
          if (answers[q] !== -1) {
            lastSelected[questions[q].options[answers[q]].type] = q;
          }
        }

        // Find max score
        let maxScore = -1;
        for (let i = 0; i < scores.length; i++) {
          if (scores[i] > maxScore) maxScore = scores[i];
        }

        // Collect tied types
        const tied = [];
        for (let i = 0; i < scores.length; i++) {
          if (scores[i] === maxScore) tied.push(i);
        }

        // Tiebreaker: most recently selected wins; if still tied, array order
        let resultIdx = tied[0];
        if (tied.length > 1) {
          tied.sort((a, b) => lastSelected[b] - lastSelected[a]);
          resultIdx = tied[0];
        }

        const r = results[resultIdx];
        document.getElementById("result-image").src = encodeURI(
          "images/" + r.image + ".png",
        );
        document.getElementById("result-image").alt = r.name;
        document.getElementById("result-name").textContent = r.name;

        const tagsContainer = document.getElementById("result-tags");
        tagsContainer.innerHTML = "";
        r.tags.forEach((tag) => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = tag;
          tagsContainer.appendChild(span);
        });

        const descContainer = document.getElementById("result-desc");
        descContainer.innerHTML = "";
        r.description.forEach((para) => {
          const p = document.createElement("p");
          p.className = "analysis-paragraph";
          p.textContent = para;
          descContainer.appendChild(p);
        });
        document.getElementById("result-quote").textContent = r.quote;

        showPage("page-result");
      }

      // ─── Reset ───
      function resetQuiz() {
        currentQuestion = 0;
        scores.fill(0);
        answers.fill(-1);
        showPage("page-cover");
      }
